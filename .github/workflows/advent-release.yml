
name: PIPOLE Adventskalender – Release Scheduler

on:
  schedule:
    # 00:00 Uhr deutscher Zeit am 1. Dezember
    - cron: "0 23 30 11 *"

    # 00:00 Uhr deutscher Zeit vom 2. bis 24. Dezember
    - cron: "0 23 1-23 12 *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipole-advent-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Publish today's Advent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(TZ=Europe/Berlin date +%d)
          MONTH=$(TZ=Europe/Berlin date +%m)

          DAY_NUM=$((10#$DAY))

          if [ "$MONTH" != "12" ] || [ "$DAY_NUM" -lt 1 ] || [ "$DAY_NUM" -gt 24 ]; then
            echo "Heute ist kein Veröffentlichungstag."
            exit 0
          fi

          TAG="advent-2026-$(printf '%02d' "$DAY_NUM")"

          echo "Prüfe Release: $TAG"

          RELEASE_ID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" \
            | head -n 1)

          if [ -z "$RELEASE_ID" ]; then
            echo "Kein Release-Entwurf für $TAG gefunden."
            echo "Entweder fehlt der Entwurf oder er wurde bereits veröffentlicht."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --method PATCH \
            -F draft=false

          echo "Erfolgreich veröffentlicht: $TAG"
